<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LawMerge</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene"></div>
<div id="app">
  <header>
    <div class="hrow">
      <h1 class="wordmark ttl">Law<em>Merge</em></h1>
      <span class="scenetag glass" id="bdName">The care home</span>
    </div>
    <div class="plaque ttl">Find all items to win</div>
  </header>
  <div class="rewards" id="rewards"></div>
  <section class="railwrap">
    <div class="raillab"><span class="t ttl" id="chainName">The paper trail</span><span class="n" id="chainCount">1 / 7</span></div>
    <div class="rail glass" id="rail"></div>
  </section>
  <main class="boardwrap"><div class="board" id="board"></div></main>
  <nav class="subnav">
    <button class="tab glass" onclick="showChain()">The chain</button>
    <button class="tab glass" onclick="menu()">Scenes &amp; help</button>
  </nav>
  <p class="ticker coach" id="ticker" role="status" aria-live="polite" aria-atomic="true">Tap <b>Answer</b> to earn your first credits.</p>
</div>
<div class="dock" id="dock"><div class="din">
  <div class="row1">
    <div class="purse glass" id="purse">
      <div class="lab"><span id="credLab">Credits</span><b id="cNum">0</b></div>
      <div class="cbar"><div class="cfill" id="cFill" style="width:0%"></div></div>
    </div>
    <button class="mini glass hidden" id="stackBtn" onclick="openStack()" aria-label="Open the stack">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 16l9 4 9-4"/></svg>
      <span class="bg" id="stackN">0</span>
    </button>
    <button class="mini glass" id="multBtn" onclick="cycleMult()" aria-label="Change the buy multiplier">×1</button>
  </div>
  <div class="row2">
    <button class="big answer" id="answerBtn" onclick="quiz()">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M9.1 9a3 3 0 1 1 4.2 2.7c-.8.4-1.3 1.2-1.3 2.1v.4"/><circle cx="12" cy="18" r="1.15" fill="currentColor" stroke="none"/></svg>
      <span class="t"><b class="ttl">Answer</b><span id="earnLab">+10 credits</span></span>
    </button>
    <button class="big buy" id="buyBtn" onclick="buy()">
      <span class="bi" id="bIc"></span>
      <span class="t"><b class="ttl" id="bNm">Handover note</b><span id="bSub">item 1 of 7</span><i id="bCost">5 credits</i></span>
    </button>
  </div>
</div></div>
<div class="veil hide" id="veil" role="dialog" aria-modal="true"><div class="sheet" id="sheet" tabindex="-1"></div></div>
<script src="art.js"></script>
<script src="defs.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
